packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  # Its only install script echoes that it is a no-op; the package ships built.
  '@google/genai': false
  "@parcel/watcher": true
  # drizzle-kit runs its config and migrations through esbuild.
  esbuild: true
  # Pulled in by the Gemini SDK's tokenizer, which this app never loads.
  protobufjs: false

minimumReleaseAgeExclude:
  - '@supabase/auth-js@2.114.0'
  - '@supabase/functions-js@2.114.0'
  - '@supabase/postgrest-js@2.114.0'
  - '@supabase/realtime-js@2.114.0'
  - '@supabase/storage-js@2.114.0'
  - '@supabase/supabase-js@2.114.0'
